[project]
name = "dynamic-model-loader"
version = "1.0.0"
description = "Dynamic model loader for LM Studio"
license = "MIT"
requires-python = ">=3.13"
dependencies = ["lmstudio>=1.5.0"]

[project.scripts]
dynamic-model-loader = "loader.dynamic_model_loader:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loader"]

[tool.hatch.build.targets.wheel.force-include]
"loader/model_configs.json" = "loader/model_configs.json"
